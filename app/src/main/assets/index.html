<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Aile Bütçesi</title>
<style>
/* Layout: mobile ledger app — sticky top bar, one scrolling panel, bottom tab bar, full-screen sheets for editing */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E8EFEC; --line:#D5E0DB;
  --ink:#13211C; --ink-2:#51625B; --accent:#17695A; --accent-ink:#FFFFFF; --accent-soft:#D3EBE3;
  --in:#1E7A3C; --out:#B3261E; --card:#6B4FA0; --today:#FFF4CC; --shadow:0 1px 2px rgba(19,33,28,.06),0 4px 14px rgba(19,33,28,.06);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --surface-2:#22302B; --line:#2E3E38;
  --ink:#E4EEEA; --ink-2:#9DB0A8; --accent:#5CC3A8; --accent-ink:#06231C; --accent-soft:#1F3D35;
  --in:#6FD08C; --out:#FF8A80; --card:#B9A2E8; --today:#3A3418; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --surface-2:#22302B; --line:#2E3E38;
  --ink:#E4EEEA; --ink-2:#9DB0A8; --accent:#5CC3A8; --accent-ink:#06231C; --accent-soft:#1F3D35;
  --in:#6FD08C; --out:#FF8A80; --card:#B9A2E8; --today:#3A3418; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);height:54px;padding:0 16px;display:flex;align-items:center;gap:10px}
header.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
header.top .sub{color:var(--ink-2);font-size:13px;margin-left:auto}
main{flex:1;padding:0 16px 150px}
.panel[hidden]{display:none}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] .pill{background:var(--accent-soft)}
nav.tabs .pill{padding:3px 16px;border-radius:99px;display:flex}
.fab{position:fixed;z-index:7;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;display:flex;gap:8px;align-items:center}
.fab[hidden]{display:none}

/* summary */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px;display:grid;gap:4px}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600;letter-spacing:.02em}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.hero .rows{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:8px;font-size:13.5px;opacity:.92}
.hero .rows .num{text-align:right;font-weight:700}
.list{display:grid;gap:8px;margin-top:14px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;text-align:left;width:100%;cursor:pointer}
.acc .row{display:flex;align-items:center;gap:10px}
.acc .name{font-weight:700;font-size:16px;flex:1;min-width:0}
.acc .bal{font-weight:800;font-size:16px}
.acc .meta{color:var(--ink-2);font-size:13px}
.acc .due{font-size:13.5px}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.badge.card{color:var(--card)}
.badge.loan{color:var(--accent)}
.lbar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.lbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero .sub{font-size:13px;opacity:.9;font-weight:600}
.lseg{grid-template-columns:repeat(3,1fr)}
.lseg button[disabled]{opacity:.45;cursor:not-allowed}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
.tag.ok{color:var(--in)} .tag.pl{color:var(--card)} .tag.no{color:var(--ink-2)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.hint{color:var(--ink-2);font-size:13px;margin:14px 2px 0}
.neg{color:var(--out)!important}

/* transactions */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mhead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:14px 2px 6px}
.tx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;margin-bottom:6px}
.tx .d{width:38px;text-align:center;flex:none}
.tx .d b{display:block;font-size:18px;font-weight:800;line-height:1}
.tx .d span{font-size:11px;color:var(--ink-2);font-weight:600}
.tx .body{flex:1;min-width:0}
.tx .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .w{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:800;white-space:nowrap}
.tx.plan{border-style:dashed}
.plan-tag{font-size:10.5px;font-weight:700;color:var(--card);letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* report */
.rnav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rnav .ttl{flex:1;text-align:center;font-weight:800}
.rnav .ttl small{display:block;font-weight:600;color:var(--accent);font-size:12.5px;cursor:pointer}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.table{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:clip}
.trow{display:grid;grid-template-columns:1.15fr 1fr 1fr 1.25fr;gap:6px;padding:6px 12px;font-size:13.5px;border-top:1px solid var(--line);align-items:center}
.trow>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .r{text-align:right}
.thead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:2;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2);border-top:0;letter-spacing:.02em}
.tmonth{background:var(--surface-2);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-top:1px solid var(--line)}
.tmonth.trow{display:grid;row-gap:2px;font-size:13px;letter-spacing:0;text-transform:none;padding-top:8px;padding-bottom:8px}
.tmonth .mn{grid-column:1/3;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.tmonth .net{grid-column:3/5;font-weight:700;color:var(--ink-2);font-size:12.5px}
.tmonth .net b{color:var(--ink)}
.tmonth .net b.neg{color:var(--out)}
.tmonth .lb{font-size:12px;color:var(--ink-2);font-weight:600}
.tmonth .r.in,.tmonth .r.out{font-weight:800}
.trow.act{cursor:pointer}
.trow.act .bal{font-weight:800}
.trow.today{background:var(--today)}
.trow.today .dt{font-weight:800}
.trow .dt span{color:var(--ink-2);font-size:12px;margin-left:3px}
.in{color:var(--in)} .out{color:var(--out)}
.bnote{font-size:13px;color:var(--ink-2);margin:0 2px 10px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:9px 14px;border-top:1px solid var(--line);align-items:baseline}
.brow .dt{font-weight:600}
.brow .dt span{color:var(--ink-2);font-size:12.5px;font-weight:500;margin-left:4px}
.brow .bv{font-size:17px;font-weight:800;text-align:right}
.brow .chg{grid-column:2;text-align:right;font-size:12.5px;font-weight:700}
.brow.act{cursor:pointer}
.brow.today{background:var(--today)}
.brow.today .dt{font-weight:800}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mrow:first-child{border-top:0}
.mrow .mn{flex:1;min-width:0;display:grid;gap:2px}
.ord{display:flex;flex-direction:column;gap:4px}
.ord button{width:34px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ord button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ord button:disabled{opacity:.3;cursor:default}
.mrow .mn b{font-size:15.5px}
.mrow .ma{display:flex;gap:6px}
.mrow .ma .chip{padding:6px 11px;font-size:13px}
.mrow{gap:10px;padding:10px 12px}
.chip.del{color:var(--out);border-color:var(--out)}
.mconf{margin:0 14px 12px;background:var(--surface);border:1px solid var(--out);border-radius:12px;padding:12px;display:grid;gap:10px;font-size:14px}
.mconf .two button{padding:11px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface-2)}
.mconf .two .yes{background:var(--out);color:#fff;border-color:var(--out)}
.mconf.block{border-color:var(--line);border-left:4px solid var(--card)}
.addacc{width:100%;margin-top:14px}
.addacc:disabled{opacity:.45;cursor:not-allowed}
.bk{margin-top:26px;display:grid;gap:10px}
.bk h3{margin:0;font-size:17px}
.bk .bnote{margin:0}
.bkbtns{display:grid;gap:8px}
.bkbtn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.bkbtn:hover{border-color:var(--accent)}
.bkbtn small{display:block;font-weight:500;color:var(--ink-2);font-size:12.5px}
.bkbtn svg{flex:none;color:var(--accent)}
.bkmsg{font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.bkmsg.bad{background:var(--surface);border:1px solid var(--out);color:var(--out)}
.rs{margin-top:26px;display:grid;gap:10px}
.rs h3{margin:0;font-size:17px}
.rsbtn{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;text-align:left;width:100%;color:var(--out)}
.rsbtn small{font-weight:500;color:var(--ink-2);font-size:12.5px}
.rsbtn:hover{border-color:var(--out)}
.rsbox{background:var(--surface);border:1px solid var(--out);border-radius:12px;padding:14px;display:grid;gap:10px;font-size:14px}
.rsbox .two button{padding:12px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface-2)}
.rsbox .two .yes{background:var(--out);color:#fff;border-color:var(--out)}
.rsbox .two .yes:disabled{opacity:.4;cursor:not-allowed}
.rsbox .linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}
.legend{font-size:12.5px;color:var(--ink-2);margin:10px 2px 0}
/* hareketler: ay özeti + günlük gruplar */
.msum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin-bottom:10px}
.msum .mc{display:grid;gap:2px;min-width:0}
.msum .mc span{font-size:12px;color:var(--ink-2);font-weight:600}
.msum .mc b{font-size:clamp(13px,3.8vw,16px);letter-spacing:-.01em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msum .mbal{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-size:13px;color:var(--ink-2);font-weight:600}
.msum .mbal b{color:var(--ink);font-weight:800}
.vbar{display:flex;align-items:flex-start;gap:8px}
.vbar .filters{flex:1;margin:2px 0 6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vbar .filters::-webkit-scrollbar{display:none}
.vbar .filters .chip{flex:none}
#p-tx .tx .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vbar .vt{flex:none;margin-top:2px}
.dayh{display:flex;align-items:baseline;gap:10px;padding:14px 4px 6px;font-size:13.5px;cursor:pointer}
.dayh .dd{flex:1;min-width:0;color:var(--ink-2)} .dayh .dd b{color:var(--ink);font-weight:800}
.dayh .dd i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-left:2px}
.dayh .dn{font-size:12.5px;font-weight:700}
.dayh .db{font-weight:800;font-size:14px}
.dayh.fut .dd b,.dayh.fut .db{opacity:.75}
.dayh.today{background:var(--today);border-radius:10px;padding:10px 10px 8px;margin:8px 0 6px}
.tx .ic{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.tx .ic svg{width:17px;height:17px}
.tx .ic.in{color:var(--in)} .tx .ic.out{color:var(--out)} .tx .ic.cd{color:var(--card)}
.amt.muted{color:var(--ink-2);font-weight:600}
/* yatırımlar */
.ivhead{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px}
.ivhead .row{display:flex;align-items:center;gap:10px}
.ivhead .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600;flex:1}
.ivhead .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.ivhead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.eye{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.eye svg{width:18px;height:18px}
.pl.in{color:var(--in)} .pl.out{color:var(--out)}
.ivchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.ivchips .chip{padding:5px 12px;font-size:13px}
.warn{color:var(--out);font-size:12.5px;font-weight:600}
/* hesap detayı */
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.dhead{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;margin-bottom:6px}
.dhead .row{display:flex;align-items:center;gap:10px}
.dhead .nm{font-size:19px;font-weight:800;flex:1;min-width:0}
.dhead .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.dhead .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600}
.dhead .chip{padding:6px 12px;font-size:13px}
.tx .amtw{text-align:right;flex:none}
.tx .rb{display:block;font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.tx.nolink{cursor:default}
.nowline{display:flex;align-items:center;gap:8px;margin:12px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.nowline::before,.nowline::after{content:"";flex:1;height:2px;background:var(--accent);opacity:.35;border-radius:2px}
.shead{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;margin:16px 2px 6px}
.shead b{font-size:15px}
.shead .st{grid-column:1;font-size:12.5px;font-weight:700}
.shead .tot{grid-row:1/3;grid-column:2;font-weight:800;font-size:16px}
.st.open{color:var(--card)} .st.due{color:var(--out)} .st.paid{color:var(--ink-2)}
.openrow{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;font-weight:700;margin-top:6px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sbox{display:flex;flex-direction:column;flex:1;min-height:0;width:100%}
.sheet .bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.sheet .bar h2{margin:0;font-size:18px;flex:1}
.sheet .content{flex:1;overflow:auto}
.sheet form{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.txtbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 6px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[data-t="GELIR"][aria-pressed="true"]{color:var(--in)}
.seg button[data-t="GIDER"][aria-pressed="true"]{color:var(--out)}
label.f{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.amount{font-size:26px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13.5px;color:var(--card);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--card);border-radius:10px;padding:10px 12px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.stepper output{min-width:92px;text-align:center;font-weight:800;color:var(--ink)}
.small{font-size:12.5px;color:var(--ink-2);font-weight:500}
.err{color:var(--out);font-weight:600;font-size:14px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;cursor:pointer}
.danger{background:none;border:1px solid var(--out);color:var(--out);border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
.switch{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.confirm{background:var(--surface);border:1px solid var(--out);border-radius:12px;padding:12px;display:grid;gap:10px}
.confirm .two button{padding:12px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface-2)}
.confirm .two .yes{background:var(--out);color:#fff;border-color:var(--out)}

/* day detail */

<script id="logic">
// ================= HESAP MANTIĞI (Android sürümüyle aynı) =================
const DAY = 86400000;
const ep = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);
const ymd = e => { const t = new Date(e * DAY); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), w: t.getUTCDay() }; };
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function addMonths(e, n) {
  const { y, m, d } = ymd(e);
  let mm = m - 1 + n; const yy = y + Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12 + 1;
  return ep(yy, mm, Math.min(d, dim(yy, mm)));
}
function firstOfMonth(e) { const { y, m } = ymd(e); return ep(y, m, 1); }
function endOfMonth(e) { const { y, m } = ymd(e); return ep(y, m, dim(y, m)); }
/** e gününde veya sonrasında gelen ilk hesap kesim günü */
function cutDate(e, cut) {
  const { y, m, d } = ymd(e);
  const c = Math.min(cut, dim(y, m));
  if (d <= c) return ep(y, m, c);
  const n = ymd(addMonths(ep(y, m, 1), 1));
  return ep(n.y, n.m, Math.min(cut, dim(n.y, n.m)));
}
/** kesim tarihinden sonraki ilk son ödeme günü (ödeme günü kesimle aynı veya önceyse ertesi ay) */
function payDate(cutE, payDay) {
  const { y, m, d } = ymd(cutE);
  const p = Math.min(payDay, dim(y, m));
  if (p > d) return ep(y, m, p);
  const n = ymd(addMonths(ep(y, m, 1), 1));
  return ep(n.y, n.m, Math.min(payDay, dim(n.y, n.m)));
}
/** bir önceki ayın kesim günü */
function prevCut(cutE, cut) { const { y, m } = ymd(cutE); const pm = ymd(addMonths(ep(y, m, 1), -1)); return ep(pm.y, pm.m, Math.min(cut, dim(pm.y, pm.m))); }
const defaultPayDay = cut => ((cut + 9) % 30) + 1;
function normAcc(a) {
  const cutDay = Number.isInteger(a.cutDay) && a.cutDay >= 1 && a.cutDay <= 31 ? a.cutDay : 15;
  const payDay = Number.isInteger(a.payDay) && a.payDay >= 1 && a.payDay <= 31 ? a.payDay : defaultPayDay(cutDay);
  return { ...a, cutDay, payDay };
}
/** kart harcamasının bakiyeden düşeceği gün: kesimden sonraki son ödeme günü */
const cardDue = (t, a) => payDate(cutDate(t.date, a.cutDay), a.payDay);
function todayEp() { const n = new Date(); return ep(n.getFullYear(), n.getMonth() + 1, n.getDate()); }

const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DAYS = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const DAYS_LONG = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const pad = n => String(n).padStart(2, "0");
const fDate = e => { const t = ymd(e); return `${pad(t.d)}.${pad(t.m)}.${t.y}`; };
const fShort = e => { const t = ymd(e); return `${pad(t.d)}.${pad(t.m)}`; };
const fLong = e => { const t = ymd(e); return `${t.d} ${MONTHS[t.m - 1]} ${t.y}, ${DAYS_LONG[t.w]}`; };
const fMonth = e => { const t = ymd(e); return `${MONTHS[t.m - 1]} ${t.y}`; };
const monthKey = e => { const t = ymd(e); return `${t.y}-${pad(t.m)}`; };

const NF0 = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/** kuruş -> "1.234,56" (tam liraysa kuruşsuz) */
const num = k => (k % 100 === 0 ? NF0 : NF2).format(k / 100);
const money = k => num(k) + " ₺";
function parseMoney(s) {
  let t = String(s).trim().replace(/\s/g, "").replace("₺", "");
  if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else { const dots = (t.match(/\./g) || []).length; if (dots > 1 || (dots === 1 && t.split(".")[1].length === 3)) t = t.replace(/\./g, ""); }
  if (!/^-?\d+(\.\d+)?$/.test(t)) return null;
  const neg = t.startsWith("-"); if (neg) t = t.slice(1);
  const [a, b = ""] = t.split(".");
  let k = Number(a) * 100 + Number((b + "00").slice(0, 2));
  if (b.length > 2 && Number(b[2]) >= 5) k += 1;
  return neg ? -k : k;
}
function toInput(k) { if (k % 100 === 0) return String(k / 100); return (k / 100).toFixed(2).replace(/0$/, "").replace(".", ","); }

function defaultAccounts() {
  return [
    { id: 1, name: "Nakit", opening: 0, isCard: false, cutDay: 1, payAccountId: 0 },
    { id: 2, name: "Banka Hesabı", opening: 0, isCard: false, cutDay: 1, payAccountId: 0 },
    { id: 3, name: "İkinci Banka", opening: 0, isCard: false, cutDay: 1, payAccountId: 0 },
    { id: 4, name: "Birikim", opening: 0, isCard: false, cutDay: 1, payAccountId: 0 },
    { id: 5, name: "Kredi Kartı", opening: 0, isCard: true, cutDay: 15, payDay: 25, payAccountId: 2 },
  ].map(normAcc);
}

/** kredi kartı ya da kredi olmayan, içinde para tutulan hesap */
const isNormal = a => !!a && !a.isCard && !a.isLoan;
/** kredinin tüm taksit tarihleri (1..vade), ilk taksit tarihinden itibaren her ay aynı gün */
const loanPlan = L => Array.from({ length: L.months }, (_, i) => ({ n: i + 1, date: addMonths(L.firstDate, i) }));
/** krediden oluşan kayıtlar: isteğe bağlı kredi girişi + daha önce ödenmemiş her taksit için bir gider */
function loanTxs(L) {
  const out = [];
  if (L.disburse && L.principal > 0) out.push({ id: `ln-${L.uid}-0`, type: "GELIR", amount: L.principal, date: L.disburseDate, acc: L.payAccountId, to: 0, note: `${L.name} · kredi girişi`, loan: L.uid, inst: 0 });
  for (const p of loanPlan(L)) if (p.n > L.paidBefore) out.push({ id: `ln-${L.uid}-${p.n}`, type: "GIDER", amount: L.installment, date: p.date, acc: L.payAccountId, to: 0, note: `${L.name} · taksit ${p.n}/${L.months}`, loan: L.uid, inst: p.n });
  return out;
}

function makeCalc(accounts, txs) {
  const byId = new Map(accounts.map(a => [a.id, a]));
  const name = id => (byId.get(id) || {}).name || "?";
  const payAccount = card => { const p = byId.get(card.payAccountId); return isNormal(p) ? p : (accounts.find(isNormal) || null); };
  const noteOr = (t, d) => (t.note && t.note.trim()) || d;
  const effects = [];
  for (const t of txs) {
    if (t.type === "GELIR") effects.push({ date: t.date, acc: t.acc, amount: t.amount, kind: "IN", label: `${noteOr(t, "Gelir")} → ${name(t.acc)}` });
    else if (t.type === "GIDER") {
      const a = byId.get(t.acc);
      if (a && a.isCard) {
        const target = (payAccount(a) || a).id;
        effects.push({ date: cardDue(t, a), acc: target, amount: -t.amount, kind: "OUT", label: `Kart · ${a.name}: ${noteOr(t, "Harcama")} (${fShort(t.date)}, ekstre ${fShort(cutDate(t.date, a.cutDay))})` });
      } else effects.push({ date: t.date, acc: t.acc, amount: -t.amount, kind: "OUT", label: `${noteOr(t, "Gider")} (${name(t.acc)})` });
    } else if (t.type === "TRANSFER") {
      const label = `Transfer: ${name(t.acc)} → ${name(t.to)}`;
      effects.push({ date: t.date, acc: t.acc, amount: -t.amount, kind: "TR", label });
      effects.push({ date: t.date, acc: t.to, amount: t.amount, kind: "TR", label });
    }
  }
  effects.sort((a, b) => a.date - b.date);
  const openingSum = accounts.reduce((s, a) => s + a.opening, 0);
  return {
    name, payAccount, effects,
    balance(id, d) { return ((byId.get(id) || {}).opening || 0) + effects.reduce((s, e) => s + (e.acc === id && e.date <= d ? e.amount : 0), 0); },
    total(d) { return openingSum + effects.reduce((s, e) => s + (e.date <= d ? e.amount : 0), 0); },
    /** açık dönem (kesimi bugün veya ileride) ve ödemesi henüz yapılmamış son ekstre */
    cardStatus(card, today) {
      const sumCut = c => txs.reduce((s, t) => s + (t.type === "GIDER" && t.acc === card.id && cutDate(t.date, card.cutDay) === c ? t.amount : 0), 0);
      const curCut = cutDate(today, card.cutDay), lastCut = prevCut(curCut, card.cutDay);
      const lastDue = payDate(lastCut, card.payDay);
      return { curCut, curDue: payDate(curCut, card.payDay), curSum: sumCut(curCut), lastCut, lastDue, lastSum: sumCut(lastCut), lastOpen: lastDue > today };
    },
    daily(start, end) {
      let bal = openingSum + effects.reduce((s, e) => s + (e.date < start ? e.amount : 0), 0);
      const by = new Map();
      for (const e of effects) if (e.date >= start && e.date <= end) { if (!by.has(e.date)) by.set(e.date, []); by.get(e.date).push(e); }
      const out = [];
      for (let d = start; d <= end; d++) {
        const list = by.get(d) || [];
        let inc = 0, exp = 0;
        for (const e of list) { if (e.kind === "IN") inc += e.amount; else if (e.kind === "OUT") exp -= e.amount; bal += e.amount; }
        out.push({ date: d, income: inc, expense: exp, balance: bal, items: list });
      }
      return out;
    },
  };
}
// ================= YATIRIMLAR =================
// Miktar binde bir birimle (×1000), birim fiyat kuruşla tutulur. Bütçeden tamamen ayrıdır.
const ASSETS = [
  { k: "USD", name: "Amerikan Doları", short: "Dolar", unit: "$", per: "1 $" },
  { k: "EUR", name: "Euro", short: "Euro", unit: "€", per: "1 €" },
  { k: "GBP", name: "İngiliz Sterlini", short: "Sterlin", unit: "£", per: "1 £" },
  { k: "XAU", name: "Gram Altın", short: "Altın", unit: "gr", per: "1 gram altın" },
  { k: "XAG", name: "Gram Gümüş", short: "Gümüş", unit: "gr", per: "1 gram gümüş" },
];
const assetOf = k => ASSETS.find(x => x.k === k);
function parseQty(s) {
  let t = String(s).trim().replace(/\s/g, "").replace(/[$€£]|gr$/gi, "");
  if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else { const dots = (t.match(/\./g) || []).length; if (dots > 1 || (dots === 1 && t.split(".")[1].length === 3)) t = t.replace(/\./g, ""); }
  if (!/^\d+(\.\d+)?$/.test(t)) return null;
  const [x, y = ""] = t.split(".");
  if (x.length > 11) return null;
  let m = Number(x) * 1000 + Number((y + "000").slice(0, 3));
  if (y.length > 3 && Number(y[3]) >= 5) m += 1;
  return m;
}
const NFQ = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 3 });
const fQty = m => NFQ.format(m / 1000);
const qtyLabel = (m, k) => `${fQty(m)} ${assetOf(k).unit}`;
const qtyToInput = m => String(m / 1000).replace(".", ",");
/** İşlemleri tarih sırasına koyar: aynı gün önce alışlar */
const invSort = list => list.slice().sort((x, y) => x.date - y.date || (x.kind === y.kind ? 0 : x.kind === "AL" ? -1 : 1) || String(x.id).localeCompare(String(y.id)));
/** Bir varlığın durumu (ortalama maliyet yöntemi). Satış eldekinden fazlaysa oversell = o işlemin tarihi. */
function invPosition(items, prices, k) {
  let qty = 0, cost = 0, realized = 0, n = 0, oversell = null;
  for (const it of invSort(items.filter(t => t.asset === k))) {
    n++;
    const amt = it.qty * it.price / 1000;
    if (it.kind === "AL") { qty += it.qty; cost += amt; }
    else {
      if (it.qty > qty && oversell == null) oversell = it.date;
      const q = Math.min(it.qty, qty), c = qty ? cost * q / qty : 0;
      realized += q * it.price / 1000 - c; cost -= c; qty -= q;
    }
  }
  const pr = prices && prices[k] && Number.isInteger(prices[k].p) ? prices[k] : null;
  const value = pr ? Math.round(qty * pr.p / 1000) : null;
  cost = Math.round(cost);
  const unreal = value != null ? value - cost : null;
  return { k, n, qty, cost, avg: qty ? Math.round(cost * 1000 / qty) : null, price: pr ? pr.p : null, priceDate: pr ? pr.date : null,
    value, unreal, pct: unreal != null && cost > 0 ? unreal / cost : null, realized: Math.round(realized), oversell };
}
function invSummary(inv) {
  const pos = ASSETS.map(A => invPosition(inv.items, inv.prices, A.k)).filter(p => p.n > 0);
  const held = pos.filter(p => p.qty > 0), priced = held.filter(p => p.value != null);
  const value = priced.reduce((s, p) => s + p.value, 0), cost = priced.reduce((s, p) => s + p.cost, 0);
  return { pos, value, cost, unreal: value - cost, pct: cost > 0 ? (value - cost) / cost : null, missing: held.filter(p => p.value == null).map(p => p.k),
    realized: pos.reduce((s, p) => s + p.realized, 0) };
}
if (typeof module !== "undefined") module.exports = { ASSETS, parseQty, fQty, invPosition, invSummary, isNormal, loanPlan, loanTxs, ep, ymd, addMonths, cutDate, payDate, prevCut, normAcc, cardDue, parseMoney, toInput, num, money, makeCalc, defaultAccounts, fLong, fMonth, fDate, monthKey };
</script>

<script>
// ================= VERİ SAKLAMA =================
// Paylaşılan veri: budget/main (hesaplar) + budget/main/tx/<YYYY-MM> (o ayın kayıtları).
// db yoksa (oturum kapalı, dosya olarak açılmış vb.) bu tarayıcıda saklar.
//
// Eşzamanlı kullanım: her değişiklik bir "işlem" (op) olarak tutulur. Sunucuya yazarken
// belgenin EN GÜNCEL hâli okunur, işlem onun üzerine uygulanır ve geri yazılır; aynı belgeye
// iki cihazın aynı anda yazmaması için kısa bir kilit (lease) alınır. Böylece bir cihazın
// eklediği kayıt, başka bir cihazın yazmasıyla silinmez.
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const S = { accounts: defaultAccounts(), months: {}, txs: [], inv: { items: [], prices: {} }, mode: "loading", ready: false };
const normInv = d => ({ items: d && Array.isArray(d.items) ? d.items.map(x => ({ ...x })) : [], prices: d && d.prices && typeof d.prices === "object" ? { ...d.prices } : {} });
const LS_KEY = "aile-butcesi-v1";
const CLIENT = newId();
let dbRef = null;

function rebuildTxs() { S.txs = Object.values(S.months).flat(); }
function lsLoad() {
  S.accounts = defaultAccounts(); S.months = {}; S.inv = normInv(null);
  try { const j = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (j) { if (Array.isArray(j.accounts) && j.accounts.length) S.accounts = j.accounts.map(normAcc); S.months = j.months || {}; S.inv = normInv(j.inv); } } catch (e) {}
  rebuildTxs();
}
function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ accounts: S.accounts, months: S.months, inv: S.inv })); }
  catch (e) { setStatus("Tarayıcı kayıt alanı dolu veya kapalı; son değişiklik kaydedilemedi. Hemen yedek indirin."); }
}

// ---------- işlemler (saf fonksiyonlar: eski liste -> yeni liste) ----------
const txOp = {
  add: t => items => items.some(x => x.id === t.id) ? items.map(x => x.id === t.id ? t : x) : [...items, t],
  remove: id => items => items.filter(x => x.id !== id),
  replaceIn: (id, t) => items => items.map(x => x.id === id ? t : x),
  dropAcc: (aid, uid) => items => items.filter(t => t.acc !== aid && t.to !== aid && !(uid && t.loan === uid)),
  /** bir krediye ait kayıtları bu ay için verilen listeyle değiştir (aynı işlem iki kez uygulansa da sonuç aynı) */
  loanSet: (uid, list) => items => [...items.filter(t => t.loan !== uid), ...list],
  set: list => () => list.slice(),
};
const accOp = {
  upsert: a => list => list.some(x => x.id === a.id) ? list.map(x => x.id === a.id ? a : x) : [...list, a],
  /** yeni hesap: numarayı en güncel listeye göre verir; iki cihaz aynı anda eklese de çakışmaz */
  addNew: a => list => list.some(x => x.uid === a.uid) || list.length >= MAX_ACC ? list : [...list, { ...a, id: list.reduce((m, x) => Math.max(m, x.id), 0) + 1 }],
  remove: id => list => list.filter(a => a.id !== id),
  /** id'li hesabı ref hesabının hemen önüne (before) veya arkasına koyar; iki kez uygulansa da sonuç aynı */
  place: (id, ref, before) => list => {
    const a = list.find(x => x.id === id); if (!a || !list.some(x => x.id === ref) || id === ref) return list;
    const l = list.filter(x => x.id !== id); const j = l.findIndex(x => x.id === ref);
    l.splice(before ? j : j + 1, 0, a); return l;
  },
  set: list => () => list.map(a => ({ ...a })),
};
const invOp = {
  put: it => d => ({ ...d, items: d.items.some(x => x.id === it.id) ? d.items.map(x => x.id === it.id ? it : x) : [...d.items, it] }),
  remove: id => d => ({ ...d, items: d.items.filter(x => x.id !== id) }),
  prices: obj => d => ({ ...d, prices: { ...d.prices, ...obj } }),
  set: inv => () => normInv(inv),
};

// sunucudan gelen son durum + henüz sunucuya ulaşmamış yerel işlemler = ekranda görünen durum
let serverMonths = {}, serverAccounts = defaultAccounts(), serverInv = normInv(null);
const pendingM = [], pendingA = [], pendingI = [];
function recompute() {
  const m = { ...serverMonths };
  for (const p of pendingM) { const n = p.op(m[p.k] || []); if (n.length) m[p.k] = n; else delete m[p.k]; }
  let a = serverAccounts;
  for (const p of pendingA) a = p.op(a);
  let iv = serverInv;
  for (const p of pendingI) iv = p.op(normInv(iv));
  S.months = m; S.accounts = a; S.inv = iv; rebuildTxs();
}

/** changes: [[ayAnahtarı, op], ...] */
function mutateMonths(changes) {
  if (!dbRef) {
    for (const [k, op] of changes) { const n = op(S.months[k] || []); if (n.length) S.months[k] = n; else delete S.months[k]; }
    rebuildTxs(); lsSave(); return;
  }
  for (const [k, op] of changes) {
    const p = { k, op }; pendingM.push(p);
    remoteMutate("budget/main/tx/" + k, d => { const n = op(d && Array.isArray(d.items) ? d.items.map(x => ({ ...x })) : []); return n.length ? { items: n } : null; },
      () => { pendingM.splice(pendingM.indexOf(p), 1); });
  }
  recompute();
}
function mutateAccounts(op) {
  if (!dbRef) { S.accounts = op(S.accounts); lsSave(); return; }
  const p = { op }; pendingA.push(p);
  remoteMutate("budget/main", d => ({ version: 1, accounts: op(d && Array.isArray(d.accounts) && d.accounts.length ? d.accounts.map(a => normAcc({ ...a })) : defaultAccounts()) }),
    () => { pendingA.splice(pendingA.indexOf(p), 1); });
  recompute();
}
/** yatırımlar tek belgede: budget/main/inv/all */
function mutateInv(op) {
  if (!dbRef) { S.inv = op(normInv(S.inv)); lsSave(); return; }
  const p = { op }; pendingI.push(p);
  remoteMutate("budget/main/inv/all", d => { const n = op(normInv(d)); return n.items.length || Object.keys(n.prices).length ? n : null; },
    () => { pendingI.splice(pendingI.indexOf(p), 1); });
  recompute();
}

// ---------- sunucuya yazma: belge başına sıra, aynı anda en fazla 4 yazma ----------
const chains = new Map(); let active = 0; const waiters = []; let writeFailed = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function slot() { if (active < 4) { active++; return; } await new Promise(r => waiters.push(r)); }
function release() { const w = waiters.shift(); if (w) w(); else active--; }
function remoteMutate(path, fn, done) {
  const prev = chains.get(path) || Promise.resolve();
  const p = prev.then(async () => {
    await slot();
    try {
      await withRetry(() => mutateOnce(path, fn));
      if (writeFailed) { writeFailed = false; setStatus(""); }
      done(); recompute(); render(); // artık sunucu durumunda; bekleyen listeden çıkar
    } catch (err) {
      console.error(err); writeFailed = true; done(); recompute(); render();
      setStatus(err && err.code === "quota_exceeded" ? "Kayıt alanı doldu; eski kayıtları silerek yer açın. Son değişiklik kaydedilmedi." :
        err && err.code === "invalid_argument" ? "Bu sayfada değişiklik yapma izniniz yok; son değişiklik kaydedilmedi." :
        "Kaydedilemedi, bağlantıyı kontrol edip tekrar deneyin. Son değişiklik geri alındı.");
    } finally { release(); }
  });
  chains.set(path, p);
  p.then(() => { if (chains.get(path) === p) chains.delete(path); });
  return p;
}
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const code = e && e.code;
      if (i >= 3 || !(code === "unavailable" || code === "resource_exhausted")) throw e;
      await sleep((code === "resource_exhausted" ? 1200 : 300) * (i + 1) * (0.6 + Math.random() * 0.8));
    }
  }
}
/** Oku → işlemi uygula → yaz → tekrar okuyup değişikliğin yerinde olduğunu doğrula (değilse yeniden yaz). */
async function mutateOnce(path, fn) {
  const ref = dbRef.doc(path);
  for (let i = 0; i < 5; i++) {
    await acquireLock(path);
    const snap = await ref.get();
    const cur = snap.exists ? snap.data() : null;
    const next = fn(cur);
    if (JSON.stringify(next) === JSON.stringify(cur)) return; // değişiklik sunucuda zaten var
    if (next) await ref.set(next); else await ref.delete();
  }
  throw Object.assign(new Error("write not confirmed"), { code: "unavailable" });
}
/** Aynı belgeye iki cihazın aynı anda yazmasını önleyen kısa kilit. Desteklenmiyorsa kilitsiz devam eder. */
async function acquireLock(path) {
  const lref = dbRef.doc("budget/main/locks/" + path.replace(/\//g, "~"));
  if (typeof lref.acquire !== "function") return;
  for (let i = 0; i < 25; i++) {
    let r;
    try { r = await lref.acquire({ holder: CLIENT, ttlMs: 1500 }); } catch (e) { if (e && (e.code === "unavailable" || e.code === "resource_exhausted")) { await sleep(400); continue; } return; }
    if (r && r.acquired) return;
    const left = r && r.expiresAt ? Date.parse(r.expiresAt) - Date.now() : 300;
    await sleep(Math.min(1500, Math.max(120, left)) * (0.5 + Math.random()));
  }
}

// ---------- veri değiştiren işlevler ----------
function addTxs(list) { mutateMonths(list.map(t => [monthKey(t.date), txOp.add(t)])); render(); }
function updateTx(oldT, newT) {
  const k1 = monthKey(oldT.date), k2 = monthKey(newT.date);
  mutateMonths(k1 === k2 ? [[k1, txOp.replaceIn(oldT.id, newT)]] : [[k1, txOp.remove(oldT.id)], [k2, txOp.add(newT)]]);
  render();
}
function deleteTx(t) { mutateMonths([[monthKey(t.date), txOp.remove(t.id)]]); render(); }
function updateAccount(a) { mutateAccounts(accOp.upsert(a)); render(); }
/** kredinin kayıtlarını (taksitler + giriş) yeniden oluştur */
function saveLoanTxs(L) {
  const by = {};
  for (const t of loanTxs(L)) (by[monthKey(t.date)] = by[monthKey(t.date)] || []).push(t);
  const keys = new Set([...S.txs.filter(t => t.loan === L.uid).map(t => monthKey(t.date)), ...Object.keys(by)]);
  mutateMonths([...keys].map(k => [k, txOp.loanSet(L.uid, by[k] || [])]));
  render();
}
function addAccount(a) { mutateAccounts(accOp.addNew(a)); render(); }
function moveAccount(id, dir) {
  const i = S.accounts.findIndex(a => a.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= S.accounts.length) return;
  manConfirm = null; mutateAccounts(accOp.place(id, S.accounts[j].id, dir < 0)); render();
  const b = document.querySelector(`[data-mv="${dir}"][data-id="${id}"]:not(:disabled)`) || document.querySelector(`[data-id="${id}"][data-mv]:not(:disabled)`);
  if (b) b.focus();
}
function deleteAccount(id) {
  const acc = S.accounts.find(a => a.id === id), uid = acc && acc.isLoan ? acc.uid : null;
  const keys = Object.keys(S.months).filter(k => S.months[k].some(t => t.acc === id || t.to === id || (uid && t.loan === uid)));
  mutateMonths(keys.map(k => [k, txOp.dropAcc(id, uid)]));
  mutateAccounts(accOp.remove(id)); render();
}

async function initStore() {
  const claude = window.claude;
  const db = claude && claude.use ? await claude.use("db").catch(() => null) : null;
  if (!db) {
    S.mode = "local"; lsLoad(); S.ready = true;
    setStatus(window.AndroidBridge ? "Veriler yalnızca bu telefonda saklanıyor. Düzenli yedek almayı unutmayın (Yönet sekmesi)." : "Veriler yalnızca bu tarayıcıda saklanıyor. Düzenli yedek almayı unutmayın (Yönet sekmesi).");
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    // aynı bilgisayarda başka sekmede yapılan değişiklikleri al
    window.addEventListener("storage", e => { if (e.key === LS_KEY) { lsLoad(); render(); } });
    render(); return;
  }
  dbRef = db; S.mode = "db";
  let gotMain = false, gotTx = false, gotInv = false;
  const done = () => { recompute(); if (gotMain && gotTx && gotInv && !S.ready) { S.ready = true; setStatus(""); } render(); };
  db.doc("budget/main").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    serverAccounts = d && Array.isArray(d.accounts) && d.accounts.length ? d.accounts.map(a => normAcc({ ...a })) : defaultAccounts();
    gotMain = true; done();
  }, e => { console.error(e); setStatus("Veriler yüklenemedi. Sayfayı yenileyin."); });
  db.collection("budget/main/tx").onSnapshot(q => {
    const m = {};
    for (const doc of q.docs) { const d = doc.data(); if (d && Array.isArray(d.items)) m[doc.id] = d.items.map(x => ({ ...x })); }
    serverMonths = m; gotTx = true; done();
  }, e => { console.error(e); setStatus("Veriler yüklenemedi. Sayfayı yenileyin."); });
  db.doc("budget/main/inv/all").onSnapshot(snap => {
    serverInv = normInv(snap.exists ? snap.data() : null); gotInv = true; done();
  }, e => { console.error(e); gotInv = true; done(); });
}
function setStatus(t) { document.getElementById("status").textContent = t; }
</script>

<script>
// ================= ARAYÜZ =================
document.documentElement.lang = "tr";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const UI = { tab: "acc", filter: "all", offset: 0, txView: "list" };
try { const t = sessionStorage.getItem("ab-tab"); if (t === "rep") UI.tab = "tx"; else if (["acc", "tx", "inv", "man"].includes(t)) UI.tab = t; } catch (e) {}
const TITLES = { acc: "Hesaplar", tx: "Hareketler", inv: "Yatırımlar", man: "Hesapları Yönet" };

function render() {
  const today = todayEp();
  $("#todayLbl").textContent = fLong(today).split(",")[0];
  if (UI.accId && !S.accounts.some(a => a.id === UI.accId)) UI.accId = null;
  const det = UI.tab === "acc" && UI.accId != null;
  $("#pageTitle").textContent = det ? "Hesap hareketleri" : TITLES[UI.tab];
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === UI.tab)));
  for (const k of ["acc", "tx", "inv", "man"]) $("#p-" + k).hidden = k !== UI.tab || det;
  $("#p-det").hidden = !det;
  $("#fab").hidden = UI.tab === "man" || UI.tab === "inv";
  if (!S.ready) { $(det ? "#p-det" : "#p-" + UI.tab).innerHTML = `<div class="empty"><b>Yükleniyor…</b>Kayıtlarınız getiriliyor.</div>`; return; }
  const calc = makeCalc(S.accounts, S.txs);
  if (det) renderAccDetail(calc, today, S.accounts.find(a => a.id === UI.accId));
  else if (UI.tab === "acc") renderAccounts(calc, today);
  else if (UI.tab === "tx") renderTx(calc, today);
  else if (UI.tab === "inv") renderInv(today);
  else renderManage();
}

/** kredinin bugünkü durumu: taksit listesi, ödenen, kalan borç, sonraki taksit */
function loanStatus(L, today) {
  const txs = S.txs.filter(t => t.loan === L.uid);
  const rows = loanPlan(L).map(p => {
    const tx = txs.find(t => t.inst === p.n && t.type === "GIDER");
    if (tx) return { n: p.n, date: tx.date, amount: tx.amount, tx, st: tx.date <= today ? "paid" : "plan" };
    return { n: p.n, date: p.date, amount: L.installment, st: p.n <= L.paidBefore ? "before" : "none" };
  });
  const paid = rows.filter(r => r.st === "paid" || r.st === "before").length;
  const left = rows.filter(r => r.st === "plan");
  return { rows, paid, remaining: left.reduce((s, r) => s + r.amount, 0), next: left.sort((x, y) => x.date - y.date)[0] || null,
    entry: txs.find(t => t.inst === 0 && t.type === "GELIR") || null, total: rows.reduce((s, r) => s + r.amount, 0) };
}
const txCount = a => S.txs.filter(t => t.acc === a.id || t.to === a.id || (a.isLoan && a.uid && t.loan === a.uid)).length;

function renderAccounts(calc, today) {
  const now = calc.total(today);
  const loans = S.accounts.filter(a => a.isLoan), debt = loans.reduce((s, L) => s + loanStatus(L, today).remaining, 0);
  let h = `<div class="hero"><span class="lbl">Bugün toplam paranız</span><span class="big num ${now < 0 ? "neg" : ""}">${money(now)}</span>
    ${debt > 0 ? `<span class="sub">Kalan kredi borcu: <span class="num">${money(debt)}</span></span>` : ""}</div><div class="list">`;
  for (const a of S.accounts) {
    if (a.isLoan) {
      const s = loanStatus(a, today), pay = calc.payAccount(a);
      h += `<button class="acc" data-acc="${a.id}"><div class="row"><span class="name">${esc(a.name)}</span><span class="badge loan">Kredi</span></div>
        <div class="due">Kalan borç: <b class="num ${s.remaining ? "out" : ""}">${money(s.remaining)}</b> · ${s.paid}/${a.months} taksit ödendi</div>
        ${s.next ? `<div class="due">Sonraki taksit: <b>${fDate(s.next.date)}</b> · <b class="num">${money(s.next.amount)}</b></div>` : `<div class="due"><b>Tüm taksitler ödendi</b></div>`}
        <div class="lbar" aria-hidden="true"><i style="width:${Math.round(100 * s.paid / a.months)}%"></i></div>
        <div class="meta">Taksitler ${esc(pay ? pay.name : "-")} hesabından ödenir</div></button>`;
    } else if (a.isCard) {
      const c = calc.cardStatus(a, today); const pay = calc.payAccount(a);
      h += `<button class="acc" data-acc="${a.id}"><div class="row"><span class="name">${esc(a.name)}</span><span class="badge card">Kredi kartı</span></div>
        ${c.lastOpen && c.lastSum > 0 ? `<div class="due">Ödenecek ekstre: <b class="num out">${money(c.lastSum)}</b> · son ödeme <b>${fDate(c.lastDue)}</b></div>` : ""}
        <div class="due">Bu dönem harcama: <b class="num ${c.curSum > 0 ? "out" : ""}">${money(c.curSum)}</b> · kesim ${fShort(c.curCut)}, ödeme ${fShort(c.curDue)}</div>
        <div class="meta">Kesim günü: ${a.cutDay} · Son ödeme günü: ${a.payDay} · ${esc(pay ? pay.name : "-")} hesabından ödenir</div></button>`;
    } else {
      const b = calc.balance(a.id, today);
      h += `<button class="acc" data-acc="${a.id}"><div class="row"><span class="name">${esc(a.name)}</span><span class="bal num ${b < 0 ? "neg" : ""}">${money(b)}</span></div></button>`;
    }
  }
  h += `</div><p class="hint">Hesabın hareketlerini görmek için hesaba dokunun; adını, içindeki parayı veya kartın kesim ve ödeme gününü o sayfadaki “Düzenle” ile değiştirebilirsiniz. Hesap eklemek veya kaldırmak için “Yönet” sekmesini kullanın.</p>`;
  if (!S.txs.length) h += `<div class="empty" style="margin-top:14px"><b>Henüz kayıt yok</b>Önce hesaplarınızdaki mevcut parayı girin, sonra “Yeni kayıt” ile gelir, gider veya transfer ekleyin.</div>`;
  $("#p-acc").innerHTML = h;
}

// ---------- Hesap hareketleri (hesap detayı) ----------
const noteOf = (t, d) => (t.note && t.note.trim()) || d;
/** Normal hesabın tüm hareketleri, eskiden yeniye, her birinin sonrasındaki bakiyeyle */
function accountRows(calc, a) {
  const rows = [];
  for (const t of S.txs) {
    if (t.type === "GELIR" && t.acc === a.id) rows.push({ date: t.date, amt: t.amount, title: noteOf(t, "Gelir"), sub: "Gelir", tx: t });
    else if (t.type === "GIDER" && t.acc === a.id) rows.push({ date: t.date, amt: -t.amount, title: noteOf(t, "Gider"), sub: "Gider", tx: t });
    else if (t.type === "TRANSFER") {
      if (t.acc === a.id) rows.push({ date: t.date, amt: -t.amount, title: noteOf(t, "Transfer"), sub: "Transfer → " + calc.name(t.to), tx: t });
      if (t.to === a.id) rows.push({ date: t.date, amt: t.amount, title: noteOf(t, "Transfer"), sub: "Transfer ← " + calc.name(t.acc), tx: t });
    }
  }
  // bu hesaptan ödenen kart ekstreleri: ekstre başına tek satır
  for (const c of S.accounts) {
    if (!c.isCard) continue;
    const p = calc.payAccount(c); if (!p || p.id !== a.id) continue;
    const by = new Map();
    for (const t of S.txs) if (t.type === "GIDER" && t.acc === c.id) {
      const cut = cutDate(t.date, c.cutDay);
      const e = by.get(cut) || { cut, due: cardDue(t, c), sum: 0, n: 0 }; e.sum += t.amount; e.n++; by.set(cut, e);
    }
    for (const e of by.values()) rows.push({ date: e.due, amt: -e.sum, title: `${c.name} ekstre ödemesi`, sub: `${fDate(e.cut)} ekstresi · ${e.n} harcama`, card: c.id });
  }
  rows.sort((x, y) => x.date - y.date || (y.amt > 0) - (x.amt > 0)); // aynı gün: önce girişler
  let bal = a.opening || 0;
  for (const r of rows) { bal += r.amt; r.bal = bal; }
  return rows;
}
function rowHtml(r, today, withBal) {
  const d = ymd(r.date), plan = r.date > today;
  const attr = r.tx ? `data-tx="${esc(r.tx.id)}"` : r.card ? `data-accgo="${r.card}"` : "";
  return `<button class="tx ${plan ? "plan" : ""} ${attr ? "" : "nolink"}" ${attr}><span class="d"><b class="num">${d.d}</b><span>${DAYS[d.w]}</span></span>
    <span class="body"><div class="t">${esc(r.title)}${plan ? `<span class="plan-tag">Planlı</span>` : ""}</div><div class="w">${esc(r.sub)}</div></span>
    <span class="amtw"><span class="amt num ${r.amt > 0 ? "in" : "out"}">${r.amt > 0 ? "+" : "−"}${money(Math.abs(r.amt))}</span>${withBal ? `<span class="rb num ${r.bal < 0 ? "neg" : ""}">Bakiye ${money(r.bal)}</span>` : ""}</span></button>`;
}
function loanDetail(calc, today, a, edit) {
  const s = loanStatus(a, today), pay = calc.payAccount(a), cost = s.total - a.principal;
  let h = `<div class="dhead"><div class="row"><span class="nm">${esc(a.name)}</span><span class="badge loan">Kredi</span>${edit}</div>
    <span class="lbl">Kalan borç</span><span class="big num ${s.remaining ? "out" : ""}">${money(s.remaining)}</span>
    <span class="lbl">${s.paid}/${a.months} taksit ödendi${s.next ? ` · sonraki taksit <b>${fDate(s.next.date)}</b>, <b class="num">${money(s.next.amount)}</b>` : " · tüm taksitler ödendi"}</span>
    <div class="lbar" aria-hidden="true"><i style="width:${Math.round(100 * s.paid / a.months)}%"></i></div>
    <span class="lbl">Kredi tutarı <b class="num">${money(a.principal)}</b> · ${a.months} ay · aylık <b class="num">${money(a.installment)}</b></span>
    <span class="lbl">Toplam geri ödeme <b class="num">${money(s.total)}</b>${a.principal > 0 ? ` · faiz ve masraf <b class="num">${money(cost)}</b>` : ""}</span>
    <span class="lbl">Taksitler ${esc(pay ? pay.name : "-")} hesabından ödenir</span></div>`;
  h += `<div class="mhead">Ödeme planı</div>`;
  if (s.entry) h += rowHtml({ date: s.entry.date, amt: s.entry.amount, title: "Kredi girişi", sub: `${pay ? pay.name : "Hesap"} hesabına yatan para`, tx: s.entry }, today, false);
  let nowShown = false;
  // önceden ödenmiş (kaydı olmayan) taksitler tek satırda özetlenir
  const before = s.rows.filter(r => r.st === "before");

        <label class="f">Taksitler hangi hesaptan ödensin?<select class="inp" id="aPay">${accOptions(others(), f.pay)}</select></label>
        <label class="f">Daha önce ödenmiş taksit <span class="small">Kredi eskiyse, şimdiye kadar ödediğiniz taksit sayısı. Bunlar için kayıt oluşturulmaz.</span><input class="inp num" id="lPaid" inputmode="numeric" value="${esc(f.paid)}"></label>
        <label class="chk"><input type="checkbox" id="lDisb" ${f.disb ? "checked" : ""}><span>Kredi tutarını hesaba giriş olarak kaydet<span class="small" style="display:block;font-weight:500">Kredi parası hesabınıza yeni yattıysa veya yatacaksa işaretleyin. Para daha önce yattıysa ve hesaptaki paraya zaten dahilse işaretlemeyin.</span></span></label>
        ${f.disb ? `<label class="f">Kredi parasının hesaba yattığı gün<input class="inp" type="date" id="lDisbDate" value="${isoOf(f.disbDate)}"></label>` : ""}
        <div class="note lnote">${loanNote()}</div>
        ${isNew ? "" : `<p class="small" style="margin:0">Kaydettiğinizde bu krediye ait taksit kayıtları bu bilgilere göre yeniden oluşturulur; taksitlerde tek tek yaptığınız değişiklikler geri alınır.</p>`}`
      : `<label class="f">Şu an hesaptaki para (₺)<input class="inp num" id="aOpen" inputmode="decimal" value="${esc(f.opening)}"></label>`}
      ${f.err ? `<div class="err" role="alert">${esc(f.err)}</div>` : ""}
      <button class="primary" type="submit">Kaydet</button>`;
  }
  function sync() {
    const g = id => form.querySelector(id);
    if (g("#aName")) f.name = g("#aName").value;
    if (g("#aOpen")) f.opening = g("#aOpen").value;
    if (g("#aCut")) f.cut = g("#aCut").value;
    if (g("#aPayDay")) f.payDay = g("#aPayDay").value;
    if (g("#aPay")) f.pay = Number(g("#aPay").value);
    if (g("#lPrin")) f.principal = g("#lPrin").value;
    if (g("#lMonths")) f.months = g("#lMonths").value;
    if (g("#lInst")) f.inst = g("#lInst").value;
    if (g("#lPaid")) f.paid = g("#lPaid").value;
    if (g("#lFirst")) { const e = epOfIso(g("#lFirst").value); f.firstOk = e != null; if (e != null) f.first = e; }
    if (g("#lDisbDate")) { const e = epOfIso(g("#lDisbDate").value); f.disbOk = e != null; if (e != null) f.disbDate = e; }
  }
  /** formu yeniden çizmeden (odak kaybolmadan) özet notunu ve otomatik alanları güncelle */
  function refresh() {
    const g = id => form.querySelector(id);
    if (f.kind === "loan") {
      const before = f.disb; autoFill();
      if (g("#lPaid") && g("#lPaid").value !== f.paid && !f.paidTouched) g("#lPaid").value = f.paid;
      if (before !== f.disb) { draw(); return; }
      if (g(".lnote")) g(".lnote").innerHTML = loanNote();
    }
    if (f.kind === "card" && g(".cnote")) g(".cnote").innerHTML = cardExample(f);
    const er = g(".err"); if (er) { f.err = ""; er.remove(); }
  }
  form.onclick = e => {
    const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
    sync(); f.kind = b.dataset.k; f.err = ""; if (f.kind === "loan") autoFill(); draw();
  };
  form.onchange = e => {
    if (e.target.id === "lDisb") { sync(); f.disb = e.target.checked; f.disbTouched = true; draw(); }
    else if (e.target.id === "lFirst" || e.target.id === "lDisbDate") { sync(); refresh(); }
  };
  form.oninput = e => {
    if (e.target.id === "lPaid") f.paidTouched = true;
    if (["aCut", "aPayDay", "lMonths", "lInst", "lPrin", "lPaid"].includes(e.target.id)) { sync(); refresh(); }
  };
  form.onsubmit = e => {
    e.preventDefault(); sync();
    const fail = m => { f.err = m; draw(); };
    if (!f.name.trim()) return fail(f.kind === "loan" ? "Kredi adı boş olamaz." : "Hesap adı boş olamaz.");
    if (lock && f.kind !== kind0) { f.kind = kind0; return fail(lock); }
    const base = { ...acc, name: f.name.trim() };
    if (f.kind === "card") {
      const c = Number(f.cut);
      if (!Number.isInteger(c) || c < 1 || c > 31) return fail("Kesim günü 1 ile 31 arasında bir sayı olmalı.");
      const pd = Number(f.payDay);
      if (!Number.isInteger(pd) || pd < 1 || pd > 31) return fail("Son ödeme günü 1 ile 31 arasında bir sayı olmalı.");
      if (!others().length) return fail("Kart borcunun düşeceği, kredi kartı olmayan bir hesap gerekli.");
      saveAcc({ ...base, opening: 0, isCard: true, isLoan: false, cutDay: c, payDay: pd, payAccountId: f.pay });
    } else if (f.kind === "loan") {
      const pr = f.principal.trim() === "" ? 0 : parseMoney(f.principal);
      if (pr == null || pr < 0) return fail("Kredi tutarını sayı olarak yazın (ör. 150.000).");
      const m = Number(f.months);
      if (!Number.isInteger(m) || m < 1 || m > 480) return fail("Vade 1 ile 480 ay arasında bir tam sayı olmalı.");
      const ins = parseMoney(f.inst);
      if (!ins || ins <= 0) return fail("Aylık taksit tutarını girin (ör. 5.250).");
      if (!f.firstOk) return fail("İlk taksit tarihini geçerli bir tarih olarak girin.");
      const pd = Number(f.paid.trim() === "" ? 0 : f.paid);
      if (!Number.isInteger(pd) || pd < 0 || pd > m) return fail(`Daha önce ödenmiş taksit 0 ile ${m} arasında olmalı.`);
      if (f.disb && pr <= 0) return fail("Kredi girişi kaydı için kredi tutarını girin ya da işareti kaldırın.");
      if (f.disb && !f.disbOk) return fail("Kredi parasının yattığı günü geçerli bir tarih olarak girin.");
      if (!others().length) return fail("Taksitlerin ödeneceği, kredi kartı olmayan bir hesap gerekli.");
      const L = { ...base, opening: 0, isCard: false, isLoan: true, uid: acc.uid || newId(), principal: pr, months: m, installment: ins, firstDate: f.first,
        payAccountId: f.pay, paidBefore: pd, disburse: f.disb, disburseDate: f.disb ? f.disbDate : null };
      saveAcc(L); saveLoanTxs(L);
    } else {
      const o = f.opening.trim() === "" ? 0 : parseMoney(f.opening);
      if (o == null) return fail("Tutarı sayı olarak yazın (ör. 12.500 veya 12500,75).");
      saveAcc({ ...base, opening: o, isCard: false, isLoan: false });
    }
    closeSheet();
  };
  draw(); openSheet();
}

function cardExample(f) {
  const c = Number(f.cut), pd = Number(f.payDay);
  if (!Number.isInteger(c) || c < 1 || c > 31 || !Number.isInteger(pd) || pd < 1 || pd > 31) return "Kesim ve son ödeme günü için 1 ile 31 arasında bir gün yazın.";
  const t = todayEp(), cut = cutDate(t, c), prev = prevCut(cut, c), due = payDate(cut, pd);
  return `Örnek: <b>${fDate(prev + 1)} – ${fDate(cut)}</b> arasındaki harcamalar ${fDate(cut)} ekstresine girer ve <b>${fDate(due)}</b> tarihinde ödenir.`;
}
/** Form açılınca ilk kutuya odaklan; kullanıcı o arada başka bir kutuya geçtiyse dokunma */
function autoFocus(form, sel) {
  setTimeout(() => { const ae = document.activeElement; if (ae && form.contains(ae) && ae.matches("input,select,textarea")) return; const x = form.querySelector(sel); if (x) x.focus(); }, 60);
}
function openSheet() { $("#sheet").hidden = false; document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; }

// ---------- olaylar ----------
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  UI.tab = b.dataset.tab; UI.accId = null; UI.invShow = false; renderTx.scrolled = false;
  try { sessionStorage.setItem("ab-tab", UI.tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
});
$("#fab").addEventListener("click", () => S.ready && openTx(null, UI.tab === "acc" ? UI.accId : null));
function openDetail(id) { UI.accId = id; UI.showPlan = false; render(); window.scrollTo(0, 0); }
$("#sheetCancel").addEventListener("click", closeSheet);
$("main").addEventListener("click", e => {
  const bk = e.target.closest("[data-bk]");
  if (bk && S.ready) {
    const csv = bk.dataset.bk === "csv";
    const name = `aile-butcesi-${csv ? "liste" : "yedek"}-${isoToday()}.${csv ? "csv" : "json"}`;
    BK.msg = ""; BK.restore = null;
    offerFile(name, csv ? backupCsv() : backupJson()).then(r => {
      if (r === "ok") { BK.msg = window.AndroidBridge ? `“${name}” kaydedildi.` : `“${name}” indirildi.`; BK.bad = false; }
      else if (r === "fail") { BK.msg = "Dosya indirilemedi. Sayfayı tarayıcıda açıp tekrar deneyin."; BK.bad = true; }
      render();
    });
    return;
  }
  if (e.target.closest("[data-bkno]")) { BK.restore = null; BK.msg = ""; render(); return; }
  if (e.target.closest("[data-bkyes]") && BK.restore) {
    const r = BK.restore; BK.restore = null; applyRestore(r);
    BK.msg = `Yedek geri yüklendi: ${r.accounts.length} hesap, ${r.nTx} kayıt.`; BK.bad = false; render(); return;
  }
  const rs = e.target.closest("[data-rs]"); if (rs && S.ready) { RS.mode = rs.dataset.rs; RS.text = ""; RS.msg = ""; render(); const i = document.getElementById("rsText"); if (i) i.focus(); return; }
  if (e.target.closest("[data-rsno]")) { RS.mode = null; RS.text = ""; render(); return; }
  if (e.target.closest("[data-rsyes]") && RS.mode && rsOk(RS.text)) {
    const all = RS.mode === "all"; resetData(RS.mode);
    RS.mode = null; RS.text = ""; RS.msg = all ? "Her şey sıfırlandı. Uygulama ilk açıldığı haline döndü." : "Tüm kayıtlar silindi. Hesaplarınız duruyor.";
    manConfirm = null; BK.msg = ""; BK.restore = null; render(); return;
  }
  const mv = e.target.closest("[data-mv]");
  if (mv && S.ready) { moveAccount(Number(mv.dataset.id), Number(mv.dataset.mv)); return; }
  const ed = e.target.closest("[data-edit]"); if (ed && S.ready) { manConfirm = null; return openAccount(S.accounts.find(x => x.id === Number(ed.dataset.edit))); }
  const dl = e.target.closest("[data-del]"); if (dl) { manConfirm = Number(dl.dataset.del); render(); return; }
  if (e.target.closest("[data-delno]")) { manConfirm = null; render(); return; }
  const dy = e.target.closest("[data-delyes]"); if (dy) { const id = Number(dy.dataset.delyes); manConfirm = null; if (!removeBlock(S.accounts.find(x => x.id === id) || {})) deleteAccount(id); else render(); return; }
  if (e.target.closest("[data-addacc]") && S.ready) { manConfirm = null; newAccount(); return; }
  const a = e.target.closest("[data-acc]"); if (a && S.ready) return openDetail(Number(a.dataset.acc));
  const go = e.target.closest("[data-accgo]"); if (go && S.ready) { UI.tab = "acc"; try { sessionStorage.setItem("ab-tab", "acc"); } catch (err) {} return openDetail(Number(go.dataset.accgo)); }
  if (e.target.closest("[data-showplan]")) { UI.showPlan = !UI.showPlan; render(); return; }
  if (e.target.closest("[data-back]")) { UI.accId = null; render(); window.scrollTo(0, 0); return; }
  const t = e.target.closest("[data-tx]"); if (t) { const tx = S.txs.find(x => String(x.id) === t.dataset.tx); if (tx) openTx(tx); return; }
  if (e.target.closest("[data-inveye]")) { UI.invShow = !UI.invShow; render(); return; }
  if (e.target.closest("[data-invadd]") && S.ready) return openInvTx(null);
  if (e.target.closest("[data-invprice]") && S.ready) return openInvPrices();
  const ia = e.target.closest("[data-invasset]"); if (ia) { UI.invAsset = ia.dataset.invasset; render(); const m = document.querySelector("#p-inv .mhead"); if (m) m.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const ifl = e.target.closest("[data-invf]"); if (ifl) { UI.invAsset = ifl.dataset.invf || null; render(); return; }
  const itx = e.target.closest("[data-invtx]"); if (itx) { const it = S.inv.items.find(x => String(x.id) === itx.dataset.invtx); if (it) openInvTx(it); return; }
  if (e.target.closest("[data-txview]")) { UI.txView = UI.txView === "table" ? "list" : "table"; renderTx.scrolled = false; render(); return; }
  const dh = e.target.closest("[data-dayh]"); if (dh) { const r = lastRows.find(x => x.date === Number(dh.dataset.dayh)); if (r && r.items.length) showDay(r); return; }
  const fl = e.target.closest("[data-filter]"); if (fl) { UI.filter = fl.dataset.filter; render(); return; }
  const n = e.target.closest("[data-nav]"); if (n) { const v = Number(n.dataset.nav); UI.offset = v === 0 ? 0 : UI.offset + v; renderTx.scrolled = v !== 0; render(); if (v !== 0) window.scrollTo(0, 0); return; }
  const d = e.target.closest("[data-day]"); if (d) showDay(lastRows[Number(d.dataset.day)]);
});
$("main").addEventListener("input", e => {
  if (e.target.id !== "rsText") return;
  RS.text = e.target.value;
  const b = document.querySelector("[data-rsyes]"); if (b) b.disabled = !rsOk(RS.text);
});
$("main").addEventListener("change", e => {
  if (e.target.id !== "bkFile" || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0];
  if (file.size > 5 * 1024 * 1024) { BK.msg = "Dosya çok büyük; doğru yedek dosyasını seçtiğinizden emin olun."; BK.bad = true; render(); return; }
  const fr = new FileReader();
  fr.onload = () => { const r = parseBackup(fr.result); if (typeof r === "string") { BK.msg = r; BK.bad = true; BK.restore = null; } else { BK.restore = r; BK.msg = ""; } render(); };
  fr.onerror = () => { BK.msg = "Dosya okunamadı."; BK.bad = true; render(); };
  fr.readAsText(file);
});
$("main").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-day],[data-nav]")) { e.preventDefault(); e.target.click(); } });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal" || e.target.closest("[data-close]")) $("#modal").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#modal").hidden) $("#modal").hidden = true; else if (!$("#sheet").hidden) closeSheet(); else if (UI.accId != null) { UI.accId = null; render(); } } });

// Android geri tuşu: açık pencereyi/sayfayı kapatır; kapatacak bir şey yoksa false döner (uygulama kapanır)
window.__androidBack = () => {
  if (!$("#modal").hidden) { $("#modal").hidden = true; return true; }
  if (!$("#sheet").hidden) { closeSheet(); return true; }
  if (UI.accId != null) { UI.accId = null; render(); return true; }
  if (UI.tab !== "acc") { UI.tab = "acc"; UI.invShow = false; try { sessionStorage.setItem("ab-tab", "acc"); } catch (e) {} render(); window.scrollTo(0, 0); return true; }
  return false;
};
render();
initStore();
</script>

</body>
