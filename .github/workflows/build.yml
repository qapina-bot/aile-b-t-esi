name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Hizala ve imzalama aracını ekle
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir out
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk out/Aile-Butcesi-unsigned.apk
          cp $BT/lib/apksigner.jar out/apksigner.jar
          $BT/aapt2 dump badging out/Aile-Butcesi-unsigned.apk | head -8
      - name: 'apk' dalına koy
        run: |
          cd out
          git init -q -b apk
          git add .
          git -c user.name="apk-bot" -c user.email="apk-bot@users.noreply.github.com" commit -q -m "APK: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aile-Butcesi-apk
          path: out/
